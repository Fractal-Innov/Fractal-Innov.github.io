<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fractal Innov : le démonstrateur 3D de votre stand</title>
  <!-- ⚠️ Pivot du 30/09/2026 : l'accueil renvoie vers la page du démonstrateur
       de stand (dépôt Fractal-Innov/stand). L'ancien accueil vit dans
       l'historique git (dernier état : a08fdea). -->
  <link rel="canonical" href="https://www.fractal-innov.fr/stand/" />
  <!-- Redirection dès la lecture du <head>, sans attendre le meta refresh (gardé en
       secours sans JavaScript). replace() : la page de passage ne reste pas dans
       l'historique ; paramètres et ancre suivent (?poi=, #demo). -->
  <script>location.replace('https://www.fractal-innov.fr/stand/' + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=https://www.fractal-innov.fr/stand/" />
  <!-- Page de passage au fond du site (plus de flash blanc) ; le texte n'apparaît
       qu'après 2 s, si la redirection n'a pas eu lieu. -->
  <meta name="color-scheme" content="dark" />
  <style>
    html, body { margin: 0; background: #090b13; color: #f0f0f0; font-family: system-ui, sans-serif; }
    body > p { padding: 2rem 1rem; opacity: 0; animation: secours 0s 2s forwards; }
    a { color: #a8c8ff; }
    @keyframes secours { to { opacity: 1; } }
  </style>

  <!-- Aperçu de partage : LinkedIn, WhatsApp et les messageries ne suivent pas
       le meta refresh ; sans ces balises, un lien vers l'accueil s'afficherait
       nu. Mêmes valeurs que /stand/. -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:url" content="https://www.fractal-innov.fr/stand/" />
  <meta property="og:site_name" content="Fractal Innov" />
  <meta property="og:title" content="Votre produit reste chez vous, votre démo part en salon" />
  <meta property="og:description" content="Le jumeau 3D de votre produit sur l'écran tactile de votre stand, piloté depuis un téléphone, sans réseau. Vous gardez l'outil après le salon." />
  <meta property="og:image" content="https://www.fractal-innov.fr/stand/assets/share/og-image-v3.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.fractal-innov.fr/stand/assets/share/og-image-v3.jpg" />
  <meta name="description" content="Le jumeau 3D de votre produit sur l'écran tactile de votre stand, piloté depuis un téléphone, sans réseau. Vous gardez l'outil après le salon." />

  <!-- Bloc posé par scripts/metas-publiques.mjs — page hors index, icône seule. -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://www.fractal-innov.fr/icones/fi-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://www.fractal-innov.fr/icones/fi-180.png" />
  <meta name="theme-color" content="#0b0e14" />
</head>
<body>
  <p>Fractal Innov, c'est désormais le démonstrateur 3D de votre stand. <a href="https://www.fractal-innov.fr/stand/">Continuer vers https://www.fractal-innov.fr/stand/</a></p>
</body>
</html>
